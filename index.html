<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Controle de Insumos — Estoque, compras, vendas e lucro em um só lugar</title>
    <meta
      name="description"
      content="Controle de Insumos é um SaaS para registrar compras e vendas, acompanhar o estoque em tempo real e descobrir a margem de lucro por produto. Sem planilha, sem cálculo manual."
    />
    <meta name="author" content="Álvaro Velame" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ctinsumos.vercel.app/" />

    <!-- CSS crítico do carregamento, disponível antes do CSS principal. -->
    <style>
      body { margin: 0; }
      .app-loading--bootstrap { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 38%, #eff6ff 0%, #f8fafc 50%, #fff 100%); color: #0f172a; font-family: Inter, system-ui, sans-serif; }
      .app-loading--bootstrap .app-loading__content { display: flex; flex-direction: column; align-items: center; text-align: center; }
      .app-loading--bootstrap .app-loading__mark { position: relative; display: grid; place-items: center; width: 104px; height: 104px; }
      .app-loading--bootstrap .app-loading__ring { position: absolute; inset: 0; box-sizing: border-box; border: 2px solid #dbeafe; border-top-color: #2563eb; border-right-color: #60a5fa; border-radius: 50%; animation: app-loading-spin 1s linear infinite; }
      .app-loading--bootstrap .app-loading__logo { display: block; width: 64px; height: 64px; border-radius: 18px; box-shadow: 0 10px 24px rgba(37, 99, 235, .2); }
      .app-loading--bootstrap .app-loading__title { margin: 22px 0 5px; font-size: 17px; font-weight: 750; letter-spacing: -.02em; }
      .app-loading--bootstrap .app-loading__label { margin: 0; color: #64748b; font-size: 13px; }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-loading--bootstrap .app-loading__ring { animation: none; } }
    </style>

    <!-- Aparência do navegador -->
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Open Graph: Facebook, LinkedIn e outros -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Controle de Insumos" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://ctinsumos.vercel.app/" />
    <meta property="og:title" content="Controle de Insumos — Veja o lucro de cada insumo" />
    <meta
      property="og:description"
      content="Registre compras e vendas, acompanhe o estoque em tempo real e descubra sua margem por produto."
    />
    <meta property="og:image" content="https://ctinsumos.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://ctinsumos.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1020" />
    <meta property="og:image:alt" content="Painel do Controle de Insumos com gráficos de lucro, margem e estoque" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Controle de Insumos — Veja o lucro de cada insumo" />
    <meta
      name="twitter:description"
      content="Estoque em tempo real, compras, vendas e margem por produto, com cálculos automáticos."
    />
    <meta name="twitter:image" content="https://ctinsumos.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Painel do Controle de Insumos com gráficos de lucro, margem e estoque" />

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Dados estruturados -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Controle de Insumos",
        "url": "https://ctinsumos.vercel.app/",
        "image": "https://ctinsumos.vercel.app/og-image.png",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Gestão de insumos, compras, vendas, estoque e margem de lucro.",
        "inLanguage": "pt-BR",
        "author": {
          "@type": "Person",
          "name": "Álvaro Velame",
          "url": "https://alvarovelame.vercel.app"
        }
      }
    </script>
  </head>
  <body>
    <noscript>Este site precisa de JavaScript para funcionar. Ative-o no seu navegador.</noscript>
    <div id="root"><div class="app-loading app-loading--bootstrap" role="status" aria-live="polite"><div class="app-loading__content"><div class="app-loading__mark" aria-hidden="true"><span class="app-loading__ring"></span><img class="app-loading__logo" src="/logo.svg" alt="" width="64" height="64" /></div><p class="app-loading__title">Controle de Insumos</p><p class="app-loading__label">Carregando…</p></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
