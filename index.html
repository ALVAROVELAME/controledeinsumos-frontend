<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Controle de Insumos — Estoque, compras, vendas e lucro em um só lugar</title>
    <meta
      name="description"
      content="Controle de Insumos é um SaaS para registrar compras e vendas, acompanhar o estoque em tempo real e descobrir a margem de lucro por produto. Sem planilha, sem cálculo manual."
    />
    <meta name="author" content="Álvaro Velame" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://insumos.vercel.app/" />

    <!-- Aparência do navegador -->
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / redes sociais
         TROQUE https://insumos.vercel.app pelo domínio real do seu deploy.
         Coloque o print em: public/og-image.png (1200 x 630 px) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Controle de Insumos" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://insumos.vercel.app/" />
    <meta property="og:title" content="Controle de Insumos — Veja o lucro de cada insumo" />
    <meta
      property="og:description"
      content="Registre compras e vendas, acompanhe o estoque em tempo real e descubra sua margem por produto."
    />
    <meta property="og:image" content="https://insumos.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Painel do Controle de Insumos com gráficos de lucro, margem e estoque" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Controle de Insumos — Veja o lucro de cada insumo" />
    <meta
      name="twitter:description"
      content="Estoque em tempo real, compras, vendas e margem por produto, com cálculos automáticos."
    />
    <meta name="twitter:image" content="https://insumos.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Painel do Controle de Insumos com gráficos de lucro, margem e estoque" />

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Dados estruturados -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Controle de Insumos",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Gestão de insumos, compras, vendas, estoque e margem de lucro.",
        "inLanguage": "pt-BR",
        "author": {
          "@type": "Person",
          "name": "Álvaro Velame",
          "url": "https://alvarovelame.vercel.app"
        },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
      }
    </script>

    <div id="root"></div>
